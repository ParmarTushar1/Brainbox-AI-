# Project-wide Gradle settings

# JVM memory settings (increase for Kotlin compile errors)
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dkotlin.daemon.jvm.options=-Xmx4096m

# Enable parallel builds (optional)
# org.gradle.parallel=true

# Use AndroidX
android.useAndroidX=true

# Specify architectures
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Enable new architecture (Fabric + TurboModules)
newArchEnabled=true

# Enable Hermes engine
hermesEnabled=true

# Kotlin compiler JVM target
kotlin.compiler.jvmTarget=17

# Disable Gradle daemon logging warnings
org.gradle.daemon.performance.disable-logging=true
